# This is a sample GitLab CI/CD configuration file for deploying to argo cd using kustomize.

stages:
- deploy-dev

deploy-dev:
  stage: deploy-dev
  before_script:
    - wget https://github.com/mikefarah/yq/releases/download/v4.34.1/yq_linux_amd64 -O /usr/bin/yq 
    - chmod +x /usr/bin/yq
    - git config --global user.email "$GIT_PUSH_USERNAME"@gmail.com
    - git config --global user.name "$GIT_PUSH_USERNAME"  
  script:
    - git checkout main
    - yq -i "(.images[] | select(.name ==\"$MS_NAME\") | .newTag) = \"$MS_VERSION\"" overlays/dev/kustomization.yaml
    - git add overlays/dev/kustomization.yaml
    - git commit -m "Update $MS_NAME image tag to $MS_VERSION"
    - git push -o ci.skip "https://${GIT_PUSH_USERNAME}:${GIT_PUSH_PASSWORD}@${GIT_PUSH_URL}"
  rules:
  - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    when: always
  # else never executes
  - when: never