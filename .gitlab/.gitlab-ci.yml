
variables:
  AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
  AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
  AWS_DEFAULT_REGION: us-east-1
  AWS_ACCOUNT_ID: 548afd6fab3bea9794a41b31da0e9404f733e222
  IMAGE_NAME: AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/juice-shop
stages:
  - cache
  - test
  - build
  - deploy 

.yarn_cache: &yarn_cache
  key:
    files:
      - yarn.lock
  paths:
    - node_modules/
    - .yarn/

cache_dependencies:
  stage: cache
  image: node:18
  cache:
    <<: *yarn_cache
    policy: pull-push
  script:
    - yarn install --frozen-lockfile

yarn_test:
  stage: test
  image: node:18
  cache:
    <<: *yarn_cache
    policy: pull
  script:
    - yarn install --frozen-lockfile
    - yarn test --watch=false

gitleaks:
  stage: test
  image: 
    name: zricethezav/gitleaks
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - gitleaks git . --redact -v -f json -r gitleaks.json
  allow_failure: true
  artifacts:
    when: always # failure, success or always 
    paths:
      - gitleaks.json

njsscan:
  stage: test
  image: python
  before_script:
    - pip3 install --upgrade njsscan
  script: 
    - njsscan --exit-warning . --sarif -o njsscan.sarif
  allow_failure: true
  artifacts: 
    when: always
    paths:
      - njsscan.sarif

semgrep: 
  stage: test
  image: returntocorp/semgrep
  variables:
    SEMGREP_RULES: p/javascript
  script:
    - semgrep ci --json --output semgrep.json
  allow_failure: true
  artifacts:
    when: always
    paths:
      - semgrep.json
  
retire:
  stage: test
  image: node:18-bullseye
  cache:
    <<: *yarn_cache
    policy: pull
  before_script:
    - npm install -g retire
  script:
    retire --path . --outputformat json --outputpath retire.json
  allow_failure: true
  artifacts:
    when: always
    paths:
      - retire.json

upload_reports:
  stage: test
  image: python
  needs:
    - gitleaks
    - njsscan
    - semgrep
    - retire
  before_script:
    - pip3 install --upgrade requests
  script:
    - python3 ../upload-reports.py gitleaks.json
    - python3 ../upload-reports.py njsscan.sarif
    - python3 ../upload-reports.py semgrep.json
    - python3 ../upload-reports.py retire.json
  allow_failure: true

build_image:
  stage: build
  image: docker:24.0.5-cli
  services:
    - name: docker:24.0.5-dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: "2375"
  before_script:
    - apk --no-cache add python3 py3-pip
    - pip3 install --upgrade awscli
    - aws ecr get-login-password | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
  script:
    - docker build -t "$IMAGE_NAME:$CI_COMMIT_SHA" -t "$IMAGE_NAME:$latest".
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHA"
    - docker push "$IMAGE_NAME:latest"

trivy:
  stage: build
  needs:
    - build_image
  image: docker:24
  services:
    - name: docker:24.0.5-dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: "2375"
  before_script:
    - apk --no-cache add python3 py3-pip
    - pip3 install --upgrade awscli
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b  /usr/local/bin
    - aws ecr get-login-password | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
  script:
    - docker pull $IMAGE_NAME:latest
    - trivy --severity HIGH,CRITICAL image --exit-code 1 $IMAGE_NAME:latest
  allow_failure: true
  

deploy_image:
  stage: deploy
  image: 
    name: amazon/aws-cli
    entrypoint: [""]
  script:
    - LOG_IN_CMD="export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID; export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY; 
      export AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION; aws ecr get-login-password |
      docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
    - COMMANDS_TO_EXECUTE="docker pull $IMAGE_NAME:latest && (docker stop juice-shop || true) && (docker rm juice-shop || true) && docker run -d --name juice-shop -p 3000:3000 $IMAGE_NAME:latest" 
    - COMMAND_ID=$(aws ssm send-command --instance-ids "i-00f39567889b9" --document-name "AWS-RunShellScript" --parameters 'commands=["$COMMANDS_TO_EXECUTE"]' --query "Command.CommandId" --output text)
    - aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-00f39567889b9"
    - aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-00f39567889b9"