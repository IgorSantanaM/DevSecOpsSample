name: CI Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: juice-shop

jobs:
  yarn_test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Run Tests
        run: CI=true yarn test --watch=false

  gitleaks:
    name: Run Gitleaks
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scan
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/path" \
            -w /path \
            zricethezav/gitleaks:latest \
            git . --redact -v \
            -f json -r gitleaks.json

      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.json
          retention-days: 7
          if-no-files-found: warn

  njsscan:
    name: Run njsscan
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install njsscan
        run: python -m pip install --upgrade njsscan

      - name: Run njsscan
        run: njsscan --exit-warning . --sarif -o njsscan.sarif

      - name: Upload njsscan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: njsscan-report
          path: njsscan.sarif
          retention-days: 7
          if-no-files-found: warn

  semgrep:
    name: Run Semgrep
    runs-on: ubuntu-latest
    continue-on-error: true

    container:
      image: semgrep/semgrep:latest

    env:
      SEMGREP_RULES: p/javascript

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Run Semgrep
        run: semgrep scan --config "$SEMGREP_RULES" --error --json --output semgrep.json .

      - name: Upload Semgrep Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.json
          retention-days: 7
          if-no-files-found: warn

  retire:
    name: Run Retire.js
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js for application dependencies
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install Application Dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Node.js for Retire.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Retire.js
        run: npm install --global retire

      - name: Run Retire.js
        run: retire --path . --outputformat json --outputpath retire.json

      - name: Upload Retire.js Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retire-report
          path: retire.json
          retention-days: 7
          if-no-files-found: warn

  upload_reports:
    name: Upload Security Reports
    runs-on: ubuntu-latest
    needs:
      - gitleaks
      - njsscan
      - semgrep
      - retire
    if: ${{ !cancelled() }}
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install requests
        run: python -m pip install --upgrade requests

      - name: Download Security Reports
        uses: actions/download-artifact@v4
        with:
          pattern: '*-report'
          merge-multiple: true
          path: reports

      - name: Upload Reports
        run: |
          failed=0
          for report in gitleaks.json njsscan.sarif semgrep.json retire.json; do
            if [ -f "reports/$report" ]; then
              python upload-reports.py "reports/$report" || failed=1
            else
              echo "::warning::Missing security report: $report"
            fi
          done
          exit "$failed"

  build_image:
    name: Build and Push Docker Image to ECR
    runs-on: ubuntu-latest
    needs:
      - yarn_test
      - gitleaks
      - njsscan
      - semgrep
      - retire
    if: github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
