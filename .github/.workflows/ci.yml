
name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: juice-shop
  ZAP_TARGET: http://35.180.67.168:3000

jobs:
  # ==========================================
  # APPLICATION TESTS
  # ==========================================

  yarn_test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Run Tests
        run: CI=true yarn test --watch=false

  # ==========================================
  # SECURITY SCANS
  # ==========================================

  gitleaks:
    name: Run Gitleaks
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/path" \
            -w /path \
            zricethezav/gitleaks:latest \
            git . --redact -v \
            -f json -r gitleaks.json

      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.json
          retention-days: 7
          if-no-files-found: warn

  njsscan:
    name: Run njsscan
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install njsscan
        run: python -m pip install --upgrade njsscan

      - name: Run njsscan
        run: |
          njsscan --exit-warning . \
            --sarif -o njsscan.sarif

      - name: Upload njsscan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: njsscan-report
          path: njsscan.sarif
          retention-days: 7
          if-no-files-found: warn

  semgrep:
    name: Run Semgrep
    runs-on: ubuntu-latest
    continue-on-error: true

    container:
      image: semgrep/semgrep:latest

    env:
      SEMGREP_RULES: p/javascript

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config "$SEMGREP_RULES" \
            --error \
            --json \
            --output semgrep.json .

      - name: Upload Semgrep Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.json
          retention-days: 7
          if-no-files-found: warn

  retire:
    name: Run Retire.js
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js for Application
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Node.js for Retire.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Retire.js
        run: npm install --global retire

      - name: Run Retire.js
        run: |
          retire --path . \
            --outputformat json \
            --outputpath retire.json

      - name: Upload Retire.js Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retire-report
          path: retire.json
          retention-days: 7
          if-no-files-found: warn

  # ==========================================
  # UPLOAD SECURITY REPORTS
  # ==========================================

  upload_reports:
    name: Upload Security Reports
    runs-on: ubuntu-latest

    needs:
      - gitleaks
      - njsscan
      - semgrep
      - retire

    if: ${{ !cancelled() }}
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install requests
        run: python -m pip install --upgrade requests

      - name: Download Security Reports
        uses: actions/download-artifact@v4
        with:
          pattern: '*-report'
          merge-multiple: true
          path: reports

      - name: Upload Reports
        run: |
          failed=0

          for report in \
            gitleaks.json \
            njsscan.sarif \
            semgrep.json \
            retire.json; do

            if [ -f "reports/$report" ]; then
              python upload-reports.py \
                "reports/$report" || failed=1
            else
              echo "::warning::Missing report: $report"
            fi
          done

          exit "$failed"

  # ==========================================
  # BUILD AND PUSH TO AMAZON ECR
  # ==========================================

  build_image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs:
      - yarn_test
      - upload_reports

    if: github.event_name == 'push'

    outputs:
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
      image_uri: ${{ steps.image.outputs.uri }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Image URI
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "uri=$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" \
            >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # TRIVY IMAGE SCANNING
  # ==========================================

  trivy:
    name: Scan Docker Image with Trivy
    runs-on: ubuntu-latest

    needs:
      - build_image

    if: github.event_name == 'push'
    continue-on-error: true

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build_image.outputs.image_uri }}
          format: json
          output: trivy.json
          severity: HIGH,CRITICAL
          exit-code: '1'
          vuln-type: os,library

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy.json
          retention-days: 7
          if-no-files-found: warn

  # ==========================================
  # DEPLOY TO TEST ENVIRONMENT VIA AWS SSM
  # ==========================================

  deploy_test:
    name: Deploy to Test EC2
    runs-on: ubuntu-latest

    needs:
      - build_image
      - trivy

    if: >-
      ${{
        always() &&
        !cancelled() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/master' &&
        needs.build_image.result == 'success'
      }}

    concurrency:
      group: juice-shop-test-deployment
      cancel-in-progress: false

    environment: test

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Image Using AWS SSM
        timeout-minutes: 20

        env:
          INSTANCE_ID: ${{ secrets.TEST_EC2_INSTANCE_ID }}
          IMAGE_URI: ${{ needs.build_image.outputs.image_uri }}
          ECR_REGISTRY: ${{ needs.build_image.outputs.ecr_registry }}

        run: |
          set -euo pipefail

          : "${INSTANCE_ID:?Missing TEST_EC2_INSTANCE_ID secret}"

          # Prepare remote deployment commands
          python3 - <<'PY'
          import json
          import os
          import shlex

          image = shlex.quote(os.environ["IMAGE_URI"])
          registry = shlex.quote(os.environ["ECR_REGISTRY"])
          region = shlex.quote(os.environ["AWS_REGION"])

          script = "\n".join([
              "#!/bin/bash",
              "set -euo pipefail",
              f"aws ecr get-login-password --region {region} | "
              f"docker login --username AWS --password-stdin {registry}",
              f"docker pull {image}",
              "docker rm -f juice-shop 2>/dev/null || true",
              f"docker run -d --name juice-shop "
              f"--restart unless-stopped -p 3000:3000 {image}",
              "test \"$(docker inspect -f "
              "'{{.State.Running}}' juice-shop)\" = true"
          ])

          with open("ssm-parameters.json", "w") as file:
              json.dump({
                  "commands": [script],
                  "executionTimeout": ["900"]
              }, file)
          PY

          # Execute deployment on EC2
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-parameters.json \
            --comment "Deploy Juice Shop to Test" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for deployment
          status=""

          for attempt in $(seq 1 90); do
            status=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            case "$status" in
              Success|Failed|Cancelled|TimedOut)
                break
                ;;
            esac

            sleep 10
          done

          # Display remote command result
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json

          if [ "$status" != "Success" ]; then
            echo "::error::Test deployment failed: $status"
            exit 1
          fi

          echo "Test deployment completed successfully."

  # ==========================================
  # OWASP ZAP DYNAMIC SECURITY TESTING
  # ==========================================

  zap:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest

    needs:
      - deploy_test

    steps:
      - name: Wait for Test Application
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if curl -fsS \
              --max-time 10 \
              -o /dev/null \
              "$ZAP_TARGET"; then
              echo "Application is ready."
              exit 0
            fi

            echo "Waiting for application..."
            sleep 10
          done

          echo "::error::Test application is unavailable."
          exit 1

      - name: Prepare ZAP Report Directory
        run: |
          mkdir -p zap-reports
          sudo chown 1000:1000 zap-reports

      - name: Run OWASP ZAP Baseline
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t "$ZAP_TARGET" \
            -g gen.conf \
            -I \
            -x baseline.xml

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: zap-reports/baseline.xml
          retention-days: 7
          if-no-files-found: warn

  # ==========================================
  # MANUAL PRODUCTION APPROVAL
  # ==========================================

  deploy_prod:
    name: Deploy to Production
    runs-on: ubuntu-latest

    needs:
      - zap

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    environment:
      name: production

    concurrency:
      group: juice-shop-production-deployment
      cancel-in-progress: false

    steps:
      - name: Production Deployment
        run: |
          echo "Deploying to production environment"
          echo "Commit: $GITHUB_SHA"
          echo "Production deployment placeholder."
