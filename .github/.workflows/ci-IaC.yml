
name: Terraform CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'IaC/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
  TF_VAR_env_prefix: "dev"
  TF_VAR_runner_registration_token: ${{ secrets.RUNNER_REGISTRATION_TOKEN }}
  TF_IN_AUTOMATION: "true"

defaults:
  run:
    working-directory: ./IaC

jobs:
  init:
    name: Terraform Init
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: init

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        continue-on-error: true
        run: terraform validate -no-color

  tfsec:
    name: Terraform Security Scan
    runs-on: ubuntu-latest
    needs: init

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tfsec
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            aquasec/tfsec:latest \
            /src --format json --out /src/tfsec.json

      - name: Upload tfsec Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfsec-report
          path: IaC/tfsec.json
          retention-days: 7
          if-no-files-found: warn

  build:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [validate, tfsec]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        run: terraform plan -input=false -out=planfile

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: IaC/planfile
          retention-days: 1

  deploy:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: build
    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: IaC/

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve planfile
