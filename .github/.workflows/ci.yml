
name: CI Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  IMAGE_NAME: igorsatnanam/demo-app
  IMAGE_TAG: juice-shop1.1

jobs:
  # 1. Unit Tests
  yarn_test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Run Tests
        run: CI=true yarn test --watch=false

  # 2. Secret Scanning
  gitleaks:
    name: Run Gitleaks
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3. JavaScript Security Scanning
  njsscan:
    name: Run njsscan
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install njsscan
        run: python -m pip install --upgrade njsscan

      - name: Run njsscan
        run: njsscan --exit-warning .

  # 4. Semgrep SAST
  semgrep:
    name: Run Semgrep
    runs-on: ubuntu-latest
    continue-on-error: true

    container:
      image: semgrep/semgrep:latest

    env:
      SEMGREP_RULES: p/javascript

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Run Semgrep
        run: semgrep scan --config "$SEMGREP_RULES" --error .

  # 5. Build and Push Docker Image
  build_image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs:
      - yarn_test
      - gitleaks
      - njsscan
      - semgrep

    if: github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
